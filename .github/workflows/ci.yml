name: ci

# Every gate a change to the template must pass. The jobs are independent (no
# `needs:`), so one red gate never hides another. No job reads a secret.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The eris commit whose `eris skills lint` judges this tree. Bump it in the
  # same change that adopts a newer kind contract.
  ERIS_REF: 0c15902c00b557b78115d81450e1c7ee147bd921

defaults:
  run:
    shell: bash

jobs:
  scrub:
    name: scrub (no private names, keys or links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # --history scans every blob and message reachable from HEAD, so it needs the full history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test ./tests
      - run: bun scripts/scrub-check.ts --history

  skills-lint:
    name: skills lint (kind contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bunx --bun "github:sibylline-labs/eris#${ERIS_REF}" skills lint .
